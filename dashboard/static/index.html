<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Clock</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a; --card: #1e2127; --line: #2d323b; --fg: #e6e8eb;
    --dim: #8b929c; --accent: #4f9dff; --ok: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: .75rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  #conn { font-size: .85rem; color: var(--dim); display: flex; align-items: center; gap: .4rem; }
  #conn::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--bad); }
  #conn.up::before { background: var(--ok); }
  main { display: grid; gap: 1rem; padding: 1rem; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); max-width: 1300px; margin: 0 auto; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 .7rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .6rem; }
  .row:last-child { margin-bottom: 0; }
  label { color: var(--dim); font-size: .85rem; }
  input, select, button, textarea { font: inherit; color: var(--fg); background: #272b33; border: 1px solid var(--line); border-radius: 6px; padding: .35rem .6rem; }
  input[type=color] { padding: 0; width: 2.5rem; height: 2rem; }
  input[type=checkbox] { width: auto; }
  input[type=range] { flex: 1; min-width: 8rem; padding: 0; }
  input[type=text], input[type=number], textarea { min-width: 0; }
  input.grow, textarea { flex: 1; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .6rem; }
  #status div { background: #272b33; border-radius: 6px; padding: .4rem .6rem; }
  #status small { display: block; color: var(--dim); font-size: .75rem; }
  #status b { font-weight: 600; word-break: break-all; }
  #log { height: 260px; overflow-y: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; background: #101216; border-radius: 6px; padding: .5rem; }
  #log div { white-space: pre-wrap; word-break: break-all; }
  #log .t { color: var(--dim); }
  #log .k { color: var(--accent); }
  #toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line); padding: .5rem 1rem; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Kitchen Clock <small id="where" style="color:var(--dim);font-weight:normal"></small></h1>
  <span id="conn">connecting…</span>
</header>
<main>
  <section class="wide">
    <h2>Status <small id="status-age" style="text-transform:none;letter-spacing:0"></small></h2>
    <div id="status"><div><small>waiting for status…</small></div></div>
    <div class="row" style="margin-top:.7rem"><button data-send="ping" data-payload="">Request status (ping)</button></div>
  </section>

  <section>
    <h2>Display brightness</h2>
    <div class="row">
      <button data-send="brightness" data-payload="on">On</button>
      <button data-send="brightness" data-payload="off">Off</button>
      <button data-send="brightness" data-payload="mid">Mid</button>
      <button data-send="brightness" data-payload="min">Min</button>
    </div>
    <div class="row">
      <input id="bright" type="range" min="0" max="1" step="0.01" value="1">
      <output id="bright-val">1.00</output>
    </div>
  </section>

  <section>
    <h2>Ambient color</h2>
    <div class="row">
      <button data-send="ambient" data-payload="auto">Auto</button>
      <button data-send="ambient" data-payload="off">Off (white)</button>
      <button data-send="ambient" data-payload="preview">Preview day</button>
    </div>
    <div class="row">
      <label>Pin color</label>
      <input id="ambient-color" type="color" value="#ffa040">
      <button id="ambient-pin">Set</button>
    </div>
  </section>

  <section>
    <h2>Message</h2>
    <div class="row"><input id="msg-text" class="grow" type="text" placeholder="Message text"></div>
    <div class="row">
      <label>Color</label><input id="msg-color" type="color" value="#595dff">
      <label><input id="msg-use-color" type="checkbox"> use</label>
      <label>Timeout (s)</label><input id="msg-timeout" type="number" min="1" value="20" style="width:5rem">
    </div>
    <div class="row">
      <label>Position</label>
      <select id="msg-x">
        <option value="">scroll</option>
        <option value="center">centered</option>
        <option value="0">left (x=0)</option>
      </select>
      <label><input id="msg-noscroll" type="checkbox"> no scroll</label>
    </div>
    <div class="row">
      <button id="msg-send" class="primary">Send</button>
      <button data-send="msg" data-payload="">Clear</button>
    </div>
  </section>

  <section>
    <h2>Animation / image</h2>
    <div class="row">
      <select id="img-name"></select>
      <label>Timeout (s)</label><input id="img-timeout" type="number" min="1" value="20" style="width:5rem">
    </div>
    <div class="row">
      <label><input id="img-only" type="checkbox" checked> hide clock while showing</label>
    </div>
    <div class="row">
      <button id="img-send" class="primary">Show</button>
      <button data-send="img" data-payload="">Clear</button>
    </div>
  </section>

  <section class="wide">
    <h2>Raw publish</h2>
    <div class="row">
      <code id="raw-prefix"></code>
      <input id="raw-topic" type="text" placeholder="topic suffix, e.g. msg" style="width:12rem">
      <input id="raw-payload" class="grow" type="text" placeholder="payload">
      <label><input id="raw-retain" type="checkbox"> retain</label>
      <button id="raw-send">Publish</button>
    </div>
  </section>

  <section class="wide">
    <h2>Live messages</h2>
    <div id="log"></div>
  </section>
</main>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const IMAGES = ["cat", "fireworks", "hop", "humi", "parrot", "rings", "ruby", "sine"];
const MAX_LOG = 200;
let prefix = "";
let toastTimer;

function toast(text, isError) {
  const el = $("toast");
  el.textContent = text;
  el.className = "show" + (isError ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, 2500);
}

async function send(topic, payload, retain = false) {
  try {
    const res = await fetch("/api/publish", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic, payload: String(payload), retain }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || res.statusText);
    }
    toast(`sent ${topic}`);
  } catch (err) {
    toast(`failed: ${err.message}`, true);
  }
}

const hex = (color) => "0x" + color.slice(1).toUpperCase();

// ---- controls ----
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-send]");
  if (btn) send(btn.dataset.send, btn.dataset.payload);
});
$("bright").addEventListener("input", (e) => { $("bright-val").textContent = Number(e.target.value).toFixed(2); });
$("bright").addEventListener("change", (e) => send("brightness", e.target.value));
$("ambient-pin").addEventListener("click", () => send("ambient", hex($("ambient-color").value)));

$("msg-send").addEventListener("click", () => {
  const text = $("msg-text").value;
  if (!text) { toast("enter a message", true); return; }
  const body = { msg: text, timeout: Number($("msg-timeout").value) || 20 };
  if ($("msg-use-color").checked) body.text_color = $("msg-color").value;
  const x = $("msg-x").value;
  if (x) body.x = x === "center" ? "center" : Number(x);
  if ($("msg-noscroll").checked) body.no_scroll = "True";
  send("msg", JSON.stringify(body));
});

for (const name of IMAGES) $("img-name").add(new Option(name, name));
$("img-send").addEventListener("click", () => {
  send("img", JSON.stringify({
    img: $("img-name").value,
    timeout: Number($("img-timeout").value) || 20,
    img_only: $("img-only").checked ? "True" : "False",
  }));
});

$("raw-send").addEventListener("click", () => {
  const topic = $("raw-topic").value.trim();
  if (!topic) { toast("enter a topic", true); return; }
  send(topic, $("raw-payload").value, $("raw-retain").checked);
});

// ---- live data ----
function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString(); }

function addLog(ev) {
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
  const row = document.createElement("div");
  const t = document.createElement("span");
  t.className = "t";
  t.textContent = fmtTime(ev.ts) + " ";
  const k = document.createElement("span");
  k.className = "k";
  k.textContent = ev.topic + (ev.retain ? " (retained) " : " ");
  row.append(t, k, document.createTextNode(ev.payload));
  log.append(row);
  while (log.children.length > MAX_LOG) log.firstChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

let statusTs = null;
function renderStatus(ev) {
  let s;
  try { s = JSON.parse(ev.payload); } catch { return; }
  statusTs = ev.ts;
  const items = [
    ["Uptime", `${s.uptime_mins} min`],
    ["Brightness", s.brightness],
    ["IP", s.ip],
    ["Free memory", s.mem_free != null ? `${Math.round(s.mem_free / 1024)} KB` : "?"],
    ["Ambient", s.ambient],
    ["Time drift", s.time_drift],
    ["Last reset", s.reset_reason],
  ];
  const box = $("status");
  box.replaceChildren();
  for (const [label, value] of items) {
    const d = document.createElement("div");
    const small = document.createElement("small");
    small.textContent = label;
    const b = document.createElement("b");
    b.textContent = value == null ? "–" : String(value);
    d.append(small, b);
    box.append(d);
  }
  if ($("bright") !== document.activeElement && typeof s.brightness === "number") {
    $("bright").value = s.brightness;
    $("bright-val").textContent = s.brightness.toFixed(2);
  }
}

function onMessage(ev) {
  addLog(ev);
  if (ev.topic === `${prefix}/status`) renderStatus(ev);
}

function setConnected(up) {
  const el = $("conn");
  el.className = up ? "up" : "";
  el.textContent = up ? "broker connected" : "broker disconnected";
}

setInterval(() => {
  if (statusTs) {
    const secs = Math.round(Date.now() / 1000 - statusTs);
    $("status-age").textContent = `(updated ${secs}s ago)`;
  }
}, 1000);

async function init() {
  const cfg = await (await fetch("/api/config")).json();
  prefix = cfg.prefix;
  $("where").textContent = `${cfg.broker} · ${cfg.prefix}`;
  $("raw-prefix").textContent = cfg.prefix + "/";

  const es = new EventSource("/api/events");
  es.addEventListener("snapshot", (e) => {
    const snap = JSON.parse(e.data);
    setConnected(snap.connected);
    $("log").replaceChildren();
    snap.log.forEach(addLog);
    const status = snap.topics[`${prefix}/status`];
    if (status) renderStatus(status);
  });
  es.addEventListener("message", (e) => onMessage(JSON.parse(e.data)));
  es.addEventListener("connection", (e) => setConnected(JSON.parse(e.data).connected));
  es.onerror = () => setConnected(false);
}
init();
</script>
</body>
</html>
